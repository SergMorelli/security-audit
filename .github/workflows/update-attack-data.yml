name: Update Attack Data

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:          # allow manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Cloudflare Radar data
        env:
          CF_API_TOKEN: ${{ secrets.CF_RADAR_TOKEN }}
        run: python3 scripts/fetch_attacks.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/attacks.json
          git diff --cached --quiet || git commit -m "data: update attack stats [skip ci]"
          git push
