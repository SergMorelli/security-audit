<!DOCTYPE html>










<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>حول</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind -->
  <link rel="stylesheet" href="/assets/css/output.css">

  <!-- AOS -->
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

  <style>
    .site-desktop-nav {
      display: none;
    }

    .site-mobile-toggle {
      display: inline-flex;
    }

    .site-mobile-menu {
      display: none;
    }

    .site-mobile-menu:not([hidden]) {
      display: block;
    }

    @media (min-width: 768px) {
      .site-desktop-nav {
        display: flex;
      }

      .site-mobile-toggle {
        display: none;
      }

      .site-mobile-menu {
        display: none !important;
      }
    }
  </style>
</head>

<body class="bg-black text-gray-200 font-mono">

<!-- 🔴 NAVBAR -->
<header class="fixed w-full z-50 bg-black/70 backdrop-blur border-b border-red-500/20">
  <div class="max-w-7xl mx-auto p-3 md:px-4 md:pb-4 md:pt-5">
    <div class="flex items-center justify-between">
      <div class="text-xs sm:text-sm md:text-xl text-cyan-400 font-bold tracking-widest min-w-0 truncate">
        Vulnerability Management Specialist
      </div>

      <div class="flex items-center gap-3 md:gap-4">
        <div class="site-desktop-nav md:flex md:items-center md:justify-end md:gap-6 text-lg">
          <nav class="flex flex-wrap items-center justify-end gap-x-3 gap-y-2" aria-label="Main navigation">
            <a href="/ar/" class="px-4 py-2 rounded-lg hover:bg-blue-900/30 hover:text-sky-300 hover:shadow-[0_0_14px_rgba(59,130,246,0.55)] transition ">الرئيسية</a>
            <a href="/ar/reports/" class="px-4 py-2 rounded-lg hover:bg-blue-900/30 hover:text-sky-300 hover:shadow-[0_0_14px_rgba(59,130,246,0.55)] transition ">التقارير</a>
            <a href="/ar/lab/" class="px-4 py-2 rounded-lg hover:bg-blue-900/30 hover:text-sky-300 hover:shadow-[0_0_14px_rgba(59,130,246,0.55)] transition ">المختبر</a>
            <a href="/ar/documents/" class="px-4 py-2 rounded-lg hover:bg-blue-900/30 hover:text-sky-300 hover:shadow-[0_0_14px_rgba(59,130,246,0.55)] transition ">المستندات</a>
            <a href="/ar/about/" class="px-4 py-2 rounded-lg hover:bg-blue-900/30 hover:text-sky-300 hover:shadow-[0_0_14px_rgba(59,130,246,0.55)] transition text-sky-300 bg-blue-900/25 shadow-[0_0_14px_rgba(59,130,246,0.45)]">حول</a>
          </nav>

          <div class="flex items-center justify-center gap-10 px-4 py-2 rounded-lg bg-black/40 ml-6 pl-6" aria-label="تبديل اللغة">
            <a href="/about/" class="text-2xl leading-none hover:scale-110 transition opacity-60" title="English" aria-label="English">&#x1F1EC;&#x1F1E7;</a>
            <a href="/ru/about/" class="text-2xl leading-none hover:scale-110 transition opacity-60" title="Русский" aria-label="Русский">&#x1F1F7;&#x1F1FA;</a>
            <a href="/ar/about/" class="text-2xl leading-none hover:scale-110 transition opacity-100" title="العربية" aria-label="العربية">&#x1F1F8;&#x1F1E6;</a>
          </div>
        </div>

        <button
          id="menuToggle"
          type="button"
          class="site-mobile-toggle md:hidden inline-flex items-center justify-center w-10 h-10 rounded border border-gray-700 text-gray-200 hover:text-cyan-400 hover:border-cyan-400 transition"
          aria-expanded="false"
          aria-controls="mobileMenu"
          aria-label="Toggle menu"
        >
          <span class="text-xl leading-none">☰</span>
        </button>
      </div>
    </div>

    <div id="mobileMenu" class="site-mobile-menu md:hidden mt-3 rounded-lg border border-gray-800 bg-black/90 p-3" hidden>
      <nav class="flex flex-col gap-2 text-sm" aria-label="Mobile navigation">
        <a href="/ar/" class="px-3 py-3 rounded hover:bg-cyan-500/10 hover:text-cyan-400 ">الرئيسية</a>
        <a href="/ar/reports/" class="px-3 py-3 rounded hover:bg-cyan-500/10 hover:text-cyan-400 ">التقارير</a>
        <a href="/ar/lab/" class="px-3 py-3 rounded hover:bg-cyan-500/10 hover:text-cyan-400 ">المختبر</a>
        <a href="/ar/documents/" class="px-3 py-3 rounded hover:bg-cyan-500/10 hover:text-cyan-400 ">المستندات</a>
        <a href="/ar/about/" class="px-3 py-3 rounded hover:bg-cyan-500/10 hover:text-cyan-400 text-cyan-400">حول</a>
      </nav>

      <div class="mt-3 pt-3 border-t border-gray-800 flex items-center justify-center gap-7" aria-label="تبديل اللغة">
        <a href="/about/" class="text-2xl leading-none hover:scale-110 transition opacity-60" title="English" aria-label="English">&#x1F1EC;&#x1F1E7;</a>
        <a href="/ru/about/" class="text-2xl leading-none hover:scale-110 transition opacity-60" title="Русский" aria-label="Русский">&#x1F1F7;&#x1F1FA;</a>
        <a href="/ar/about/" class="text-2xl leading-none hover:scale-110 transition opacity-100" title="العربية" aria-label="العربية">&#x1F1F8;&#x1F1E6;</a>
      </div>
    </div>
  </div>
</header>

<main class="pt-24 md:pt-28">
  <section class="pt-32 pb-20 text-center">
  <h1 class="text-4xl text-cyan-400 mb-6">حول</h1>
  <p class="text-gray-400">اختصاصي أمن يركز على اختبار الاختراق والدفاع عن البنية التحتية.</p>
</section>

</main>



<!-- JS -->
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>


<script>
AOS.init({
  duration: 800,
  once: true
});



const menuToggle = document.getElementById('menuToggle');
const mobileMenu = document.getElementById('mobileMenu');

if (menuToggle && mobileMenu) {
  menuToggle.addEventListener('click', () => {
    const isOpen = !mobileMenu.hasAttribute('hidden');
    if (isOpen) {
      mobileMenu.setAttribute('hidden', '');
    } else {
      mobileMenu.removeAttribute('hidden');
    }
    menuToggle.setAttribute('aria-expanded', String(!isOpen));
  });

  window.addEventListener('resize', () => {
    if (window.innerWidth >= 768) {
      mobileMenu.setAttribute('hidden', '');
      menuToggle.setAttribute('aria-expanded', 'false');
    }
  });
}
</script>

</body>
</html>
